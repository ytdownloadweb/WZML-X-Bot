name: WZML-X Bot

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Bot run hours (default 5)'
        required: false
        default: '5'

concurrency:
  group: wzml-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download cloudflared + install deps
        run: |
          wget -q -O /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version
          pip install -q pymongo requests yt-dlp google-api-python-client google-auth-httplib2 google-auth-oauthlib
          echo "yt-dlp version: $(yt-dlp --version)"

      - name: Create tunnel-status update script
        run: |
          cat > /tmp/update_status.py << 'PYEOF'
          import sys, json, base64, urllib.request
          server_url, timestamp, token, owner, repo = sys.argv[1:6]
          content = f'window.tunnelStatus = {{"status": "online", "url": "{server_url}", "updated": "{timestamp}"}};'
          if not server_url:
              content = f'window.tunnelStatus = {{"status": "offline", "url": "", "updated": "{timestamp}"}};'
          api_base = f"https://api.github.com/repos/{owner}/{repo}/contents/tunnel-status.js"
          try:
              req = urllib.request.Request(api_base, headers={"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"})
              sha = json.loads(urllib.request.urlopen(req).read())["sha"]
          except Exception:
              sha = None
          payload = {"message": "chore: update tunnel-status.js [skip ci]", "content": base64.b64encode(content.encode()).decode(), "branch": "main"}
          if sha:
              payload["sha"] = sha
          req = urllib.request.Request(api_base, data=json.dumps(payload).encode(), method="PUT",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json"})
          urllib.request.urlopen(req)
          print(f"tunnel-status.js updated: {'online' if server_url else 'offline'}")
          PYEOF

      - name: Clone and build bot image
        env:
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ secrets.UPSTREAM_BRANCH || 'wzv3' }}
        shell: bash {0}
        run: |
          UP_REPO="${UPSTREAM_REPO:-https://github.com/SilentDemonSD/WZML-X}"
          UP_BRANCH="${UPSTREAM_BRANCH:-wzv3}"
          echo "Cloning $UP_REPO (branch: $UP_BRANCH)..."
          git clone --depth 1 -b "$UP_BRANCH" "$UP_REPO" /tmp/wzml-src
          echo "Building Docker image..."
          cd /tmp/wzml-src
          docker build -t wzml-bot:latest . 2>&1 | tail -20
          echo "Image built successfully."

      - name: Send startup ntfy notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'JAI_HO' }}
        run: |
          curl -s -H "Title: WZML-X Bot Starting" \
               -H "Tags: rocket,gear" \
               -d "Bot + download server starting up. Web URL coming in ~5 min." \
               "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: Run bot container + download server
        shell: bash {0}
        run: |
          docker run -d \
            --name wzml_bot \
            -e BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
            -e TELEGRAM_API="${{ secrets.TELEGRAM_API }}" \
            -e TELEGRAM_HASH="${{ secrets.TELEGRAM_HASH }}" \
            -e OWNER_ID="${{ secrets.OWNER_ID }}" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e UPSTREAM_REPO="${{ secrets.UPSTREAM_REPO }}" \
            -e UPSTREAM_BRANCH="${{ secrets.UPSTREAM_BRANCH || 'wzv3' }}" \
            -e AUTHORIZED_CHATS="${{ secrets.AUTHORIZED_CHATS }}" \
            -e SUDO_USERS="${{ secrets.SUDO_USERS }}" \
            -e USER_SESSION_STRING="${{ secrets.USER_SESSION_STRING }}" \
            -e GDRIVE_ID="${{ secrets.GDRIVE_ID }}" \
            -e IS_TEAM_DRIVE="${{ secrets.IS_TEAM_DRIVE }}" \
            -e INDEX_URL="${{ secrets.INDEX_URL }}" \
            -e USE_SERVICE_ACCOUNTS="${{ secrets.USE_SERVICE_ACCOUNTS }}" \
            -e RCLONE_PATH="${{ secrets.RCLONE_PATH }}" \
            -e RCLONE_FLAGS="${{ secrets.RCLONE_FLAGS }}" \
            -e MEGA_EMAIL="${{ secrets.MEGA_EMAIL }}" \
            -e MEGA_PASSWORD="${{ secrets.MEGA_PASSWORD }}" \
            -e LEECH_DUMP_CHAT="${{ secrets.LEECH_DUMP_CHAT }}" \
            -e LINKS_LOG_ID="${{ secrets.LINKS_LOG_ID }}" \
            -e MIRROR_LOG_ID="${{ secrets.MIRROR_LOG_ID }}" \
            -e DEFAULT_UPLOAD="${{ secrets.DEFAULT_UPLOAD }}" \
            -e LEECH_SPLIT_SIZE="${{ secrets.LEECH_SPLIT_SIZE }}" \
            -e WEB_ACCESS_PASSWORD="${{ secrets.WEB_ACCESS_PASSWORD }}" \
            -e TIMEZONE="Asia/Kolkata" \
            -p 8080:8080 \
            wzml-bot:latest

          echo "Waiting 60 seconds for bot startup..."
          sleep 60

          if docker inspect -f '{{.State.Running}}' wzml_bot 2>/dev/null | grep -q true; then
            echo "=== Bot container is RUNNING ==="
            docker logs wzml_bot 2>&1 | tail -30
          else
            echo "=== !!! Bot container CRASHED !!! ==="
            docker logs wzml_bot 2>&1 || echo "(no logs)"
            docker rm -f wzml_bot 2>/dev/null || true
            docker run -d \
              --name wzml_bot \
              -e BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
              -e TELEGRAM_API="${{ secrets.TELEGRAM_API }}" \
              -e TELEGRAM_HASH="${{ secrets.TELEGRAM_HASH }}" \
              -e OWNER_ID="${{ secrets.OWNER_ID }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e UPSTREAM_REPO="${{ secrets.UPSTREAM_REPO }}" \
              -e UPSTREAM_BRANCH="${{ secrets.UPSTREAM_BRANCH || 'wzv3' }}" \
              -e GDRIVE_ID="${{ secrets.GDRIVE_ID }}" \
              -e TIMEZONE="Asia/Kolkata" \
              -p 8080:8080 \
              wzml-bot:latest
            sleep 15
          fi

          # Start download server in background
          echo "Starting download server on port 8081..."
          export BOT_TOKEN="${{ secrets.BOT_TOKEN }}"
          export LOG_CHAT_ID="${{ secrets.LOG_CHAT_ID }}"
          export GDRIVE_ID="${{ secrets.GDRIVE_ID }}"
          export GDRIVE_SA='${{ secrets.GDRIVE_SA }}'
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          export ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
          python3 download_server.py &
          echo "Download server started (PID: $!)"
          sleep 5
          curl -s http://localhost:8081/ping || echo "  [!] Download server ping failed"

      - name: Start tunnel + log status + broadcasts + keep-alive
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'JAI_HO' }}
          RUN_HOURS: ${{ github.event.inputs.hours || '5' }}
          PAT_TOKEN: ${{ secrets.P81 }}
        shell: bash {0}
        run: |
          HOURS=$(echo "${RUN_HOURS}" | bc -l 2>/dev/null || echo "5")
          TOTAL_SEC=$(echo "$HOURS * 3600" | bc -l 2>/dev/null || echo "18000")
          TOTAL_SEC=$(printf "%.0f" "$TOTAL_SEC")
          echo "Bot will run for $((TOTAL_SEC / 3600))h $(((TOTAL_SEC % 3600) / 60))m"

          # --- Start Cloudflare tunnel for download server (port 8081) ---
          /tmp/cloudflared tunnel --url http://localhost:8081 > /tmp/cf_server.log 2>&1 &

          SERVER_URL=""
          for i in $(seq 1 30); do
            sleep 2
            [ -z "$SERVER_URL" ] && SERVER_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf_server.log 2>/dev/null | head -1)
            if [ -n "$SERVER_URL" ]; then break; fi
          done

          echo "Server URL: ${SERVER_URL:-NONE}"

          # --- Write tunnel status to repo for the website ---
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 /tmp/update_status.py "$SERVER_URL" "$TIMESTAMP" "$PAT_TOKEN" "ytdownloadweb" "WZML-X-Bot" || echo "Status update failed (non-fatal)"

          # --- Background: startup broadcast at +5 min ---
          (
            sleep 300
            REGULAR_MSG=$(printf 'WZML-X Bot is LIVE!\n\nThe bot is now online and ready to use.\nSend /help to see available commands.\nBot will run for ~5 hours.\n\nCountdown schedule before restart:\n  - 30 min before: notification\n  - 10 min before: notification\n  - 2 min before: final warning\n\nThen ~30 min downtime before automatic restart.')
            if [ -n "$SERVER_URL" ]; then
              OWNER_MSG=$(printf 'WZML-X Bot is LIVE!\n\nBot is online.\nDownload Server: %s\n\nSend /help to see available commands.\nBot will run for ~5 hours.\n\nCountdown schedule before restart:\n  - 30 min before: notification\n  - 10 min before: notification\n  - 2 min before: final warning\n\nThen ~30 min downtime before automatic restart.' "$SERVER_URL")
            else
              OWNER_MSG="$REGULAR_MSG"
            fi
            echo "[$(date +%H:%M:%S)] Sending startup broadcast..."
            python3 broadcast.py "$REGULAR_MSG" "$OWNER_MSG" || echo "Broadcast failed (non-fatal)"
            curl -s -X POST -H "Title: WZML-X Bot is LIVE!" -H "Priority: 4" -H "Tags: tada,rocket,gear" \
                 -H "Click: ${SERVER_URL}" -d "Bot is live! Download server: ${SERVER_URL:-N/A}" \
                 "https://ntfy.sh/${NTFY_TOPIC}" || true
          ) &

          # --- Background: pre-shutdown broadcast at -30 min ---
          PRE_SHUTDOWN_30=$((TOTAL_SEC - 1800))
          (
            if [ $PRE_SHUTDOWN_30 -gt 0 ]; then sleep $PRE_SHUTDOWN_30; fi
            MSG=$(printf 'Bot Going Down in 30 Minutes\n\nThe bot will go down for a scheduled restart in 30 minutes.\n\nDowntime: ~30 minutes\nThe bot will come back online automatically.\n\nThank you for your patience!')
            echo "[$(date +%H:%M:%S)] Sending -30 min broadcast..."
            python3 broadcast.py "$MSG" || echo "Broadcast failed (non-fatal)"
            curl -s -X POST -H "Title: Bot Restarting in 30 min" -H "Priority: 3" -H "Tags: clock,warning" \
                 -d "Bot going down in 30 min. Back in ~30 min." \
                 "https://ntfy.sh/${NTFY_TOPIC}" || true
          ) &

          # --- Background: pre-shutdown broadcast at -10 min ---
          PRE_SHUTDOWN_WAIT=$((TOTAL_SEC - 600))
          (
            if [ $PRE_SHUTDOWN_WAIT -gt 0 ]; then sleep $PRE_SHUTDOWN_WAIT; fi
            MSG=$(printf 'Bot Going Down in 10 Minutes!\n\nThe bot will go down in 10 minutes for a scheduled restart.\n\nDowntime: ~30 minutes\nThe bot will come back online automatically.\n\nThank you for your patience!')
            echo "[$(date +%H:%M:%S)] Sending -10 min broadcast..."
            python3 broadcast.py "$MSG" || echo "Broadcast failed (non-fatal)"
            curl -s -X POST -H "Title: Bot Restarting in 10 min" -H "Priority: 4" -H "Tags: warning,clock,refresh" \
                 -d "Bot going down in 10 min. Back in ~30 min." \
                 "https://ntfy.sh/${NTFY_TOPIC}" || true
          ) &

          # --- Background: final countdown at -2 min ---
          FINAL_COUNTDOWN=$((TOTAL_SEC - 120))
          (
            if [ $FINAL_COUNTDOWN -gt 0 ]; then sleep $FINAL_COUNTDOWN; fi
            MSG=$(printf 'Bot Going Down NOW!\n\nThe bot is going down for restart in 2 minutes.\nPlease finish any active downloads.\n\nBack online in ~30 minutes!')
            echo "[$(date +%H:%M:%S)] Sending -2 min final countdown..."
            python3 broadcast.py "$MSG" || echo "Broadcast failed (non-fatal)"
            curl -s -X POST -H "Title: Bot Going Down NOW" -H "Priority: 5" -H "Tags: warning,x,clock" \
                 -d "Bot going down in 2 min! Back in ~30 min." \
                 "https://ntfy.sh/${NTFY_TOPIC}" || true
          ) &

          # --- Main keep-alive loop ---
          ELAPSED=0
          INTERVAL=120
          PING_COUNT=0
          while [ $ELAPSED -lt $TOTAL_SEC ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            PING_COUNT=$((PING_COUNT + 1))
            BOT_UP="UP"; CF_UP="UP"
            docker inspect -f '{{.State.Running}}' wzml_bot 2>/dev/null | grep -q true || BOT_UP="DOWN"
            ps aux | grep cloudflared | grep -v grep >/dev/null 2>&1 || CF_UP="DOWN"
            # Check download server
            curl -s http://localhost:8081/ping >/dev/null 2>&1 || echo "  [!] Download server not responding"
            REMAINING=$((TOTAL_SEC - ELAPSED))
            echo "[$(date +%H:%M:%S)] Check #${PING_COUNT} | Bot: ${BOT_UP} | Tunnel: ${CF_UP} | ${REMAINING}s left"
            if [ "$BOT_UP" = "DOWN" ]; then
              echo "  [!] Bot container is DOWN!"
              docker logs wzml_bot 2>&1 | tail -20
              if [ $PING_COUNT -le 3 ]; then
                echo "  Attempting restart..."
                docker start wzml_bot 2>/dev/null || true
                sleep 10
                docker inspect -f '{{.State.Running}}' wzml_bot 2>/dev/null | grep -q true && echo "  [+] Bot restarted!" || echo "  [!] Bot restart failed"
              else
                curl -s -X POST -H "Title: Bot CRASHED!" -H "Priority: 5" -H "Tags: x,warning" \
                     -d "Bot container is DOWN! Check #${PING_COUNT}" \
                     "https://ntfy.sh/${NTFY_TOPIC}" || true
                break
              fi
            fi
            if [ "$CF_UP" = "DOWN" ]; then
              echo "  [!] Tunnel down. Restarting cloudflared..."
              pkill -f cloudflared 2>/dev/null; sleep 2
              /tmp/cloudflared tunnel --url http://localhost:8081 > /tmp/cf_server.log 2>&1 &
              sleep 10
              SERVER_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf_server.log 2>/dev/null | head -1)
              if [ -n "$SERVER_URL" ]; then
                echo "  [+] Tunnel restarted! Server: $SERVER_URL"
                TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                python3 /tmp/update_status.py "$SERVER_URL" "$TIMESTAMP" "$PAT_TOKEN" "ytdownloadweb" "WZML-X-Bot" || true
              fi
            fi
          done
          echo "Bot run time complete. Stopping."

      - name: Stop bot + update status to offline
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'JAI_HO' }}
          PAT_TOKEN: ${{ secrets.P81 }}
        run: |
          echo "=== FINAL DOCKER LOGS ==="
          docker logs wzml_bot 2>&1 | tail -50 || true
          docker stop wzml_bot 2>/dev/null || true
          docker rm wzml_bot 2>/dev/null || true
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 /tmp/update_status.py "" "$TIMESTAMP" "$PAT_TOKEN" "ytdownloadweb" "WZML-X-Bot" || echo "Status update failed (non-fatal)"
          curl -s -X POST -H "Title: Bot Session Ended" -H "Priority: 3" -H "Tags: wave,sleep" \
               -d "Bot session ended after 5h. Will restart in ~30 min via scheduled timer." \
               "https://ntfy.sh/${NTFY_TOPIC}" || true
